name: tariff freshness
# FPA changes monthly: on the 5th of each month, open an issue listing what to
# re-verify if any tariff file is more than five weeks old. One open issue at a
# time (label: tariff-update); nothing is edited automatically.
on:
  schedule:
    - cron: '17 4 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: fresh
        run: node tools/freshness.mjs
      - if: steps.fresh.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          TITLE: ${{ steps.fresh.outputs.title }}
          BODY: ${{ steps.fresh.outputs.body }}
        with:
          script: |
            const label = 'tariff-update';
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'ffc61a', description: 'Tariff data needs re-verifying' });
            } catch (e) { if (e.status !== 422) throw e; }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body: process.env.BODY });
              return;
            }
            await github.rest.issues.create({ ...context.repo, title: process.env.TITLE, body: process.env.BODY, labels: [label] });
